plugins {
    id 'java-library'
}

sourceSets {
    main.java.srcDirs = ['src/unused']
    main.resources.srcDirs = ['src/unused']
    test.java.srcDirs = ['src/test/java']
    test.resources.srcDirs = ['src/test/resources']
}

group = 'strata.stream'
version = '1.0-SNAPSHOT'

dependencies {
    testImplementation project(':Components:Strata.Stream.Flink')
    testImplementation project(':Components:Strata.Stream.Basic')
    testImplementation(testFixtures(project(':Tests:Strata.Stream.CoreTest')))
    testImplementation 'org.slf4j:slf4j-api:2.0.0-alpha7'
    testImplementation 'org.slf4j:slf4j-log4j12:2.0.0-alpha7'
    testImplementation 'org.apache.logging.log4j:log4j-core:2.25.1'
    testImplementation "org.junit.jupiter:junit-jupiter-params:$junit_jupiter_version"
    testImplementation "org.junit.jupiter:junit-jupiter-api:$junit_jupiter_version"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:$junit_jupiter_version"
}

configurations {
    testArtifacts
}

tasks.register('testJar', Jar) {
    archiveClassifier = 'tests'
    from sourceSets.test.output
    from sourceSets.test.resources
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named("testJar").configure {
    dependsOn testClasses
}

artifacts {
    archives testJar
    testArtifacts testJar
}

test {
    useJUnitPlatform {
        includeTags("CommitStage")
    }
    jvmArgs = [
            '--add-opens=java.base/java.lang=ALL-UNNAMED',
            '--add-opens=java.base/java.lang.invoke=ALL-UNNAMED',
            '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED',
            '--add-opens=java.base/java.util.stream=ALL-UNNAMED',
            '--add-opens=java.base/java.util=ALL-UNNAMED',
            '--add-opens=java.base/java.nio=ALL-UNNAMED',
            '--add-opens=java.base/sun.nio.ch=ALL-UNNAMED',
            '--add-opens=java.base/java.io=ALL-UNNAMED',
            '--add-opens=java.base/jdk.internal.ref=ALL-UNNAMED',
            '--add-opens=java.base/java.util.concurrent.locks=ALL-UNNAMED',
            '--add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED',
            '--add-opens=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED']
}