name: Development-Pipeline
on:
  push:
    branches: [ development ]
  pull_request:
    branches: [ development ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  PROPERTIES_ENCRYPTION_KEY: ${{secrets.PROPERTIES_ENCRYPTION_KEY}}
  REPOSITORY_USER: ${{vars.REPOSITORY_USER}}
  REPOSITORY_PASSWORD: ${{secrets.REPOSITORY_PASSWORD}}
  DOCKER_USER: ${{vars.DOCKER_USER}}
  DOCKER_PASSWORD: ${{secrets.DOCKER_PASSWORD}}

jobs:
  run-commit-stage:
    runs-on: ubuntu-latest
    steps:
      - name: Check Out
        uses: actions/checkout@v3

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'corretto'

      #- name: Validate Gradle wrapper
      #  uses: gradle/wrapper-validation-action@ccb4328a959376b642e027874838f60f8e596de3

      - name: Chmod GradleW
        run: chmod a+x gradlew

      - name: Build Java with Gradle
        uses: gradle/gradle-build-action@749f47bda3e44aa060e82d7b3ef7e40d953bd629
        with:
          gradle-executable: gradlew
          arguments: build

      - name: Save Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            **/build/libs/*.jar
          retention-days: 1

      - name: Publish Test Report (Commit Stage)
        uses: mikepenz/action-junit-report@v3
        if: success() || failure() # always run even if the previous step fails
        with:
            report_paths: '**/build/test-results/test/TEST-*.xml'

  run-integration-stage:
    runs-on: ubuntu-latest
    needs: run-commit-stage
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{vars.REPOSITORY_USER}}
          password: ${{secrets.REPOSITORY_PASSWORD}}

      - name: Pull Docker image
        run: docker pull ghcr.io/johnliebenau/strata/strata-stream-testsuite:1.0.0-SNAPSHOT

      - name: Run Integration Tests
        run: |
          docker run ghcr.io/johnliebenau/strata/strata-stream-testsuite:1.0.0-SNAPSHOT \
            --package=strata.stream --tags=IntegrationStage

  run-acceptance-stage:
    runs-on: ubuntu-latest
    needs: run-integration-stage
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{vars.REPOSITORY_USER}}
          password: ${{secrets.REPOSITORY_PASSWORD}}

      - name: Pull Docker image
        run: docker pull ghcr.io/johnliebenau/strata/strata-stream-testsuite:1.0.0-SNAPSHOT

      - name: Run Acceptance Tests
        run: |
          docker run ghcr.io/johnliebenau/strata/strata-stream-testsuite:1.0.0-SNAPSHOT \
            --package=strata.stream --tags=AcceptanceStage

  run-deploy-stage:
    runs-on: ubuntu-latest
    needs: run-acceptance-stage
    steps:
      - name: Check Out
        uses: actions/checkout@v3

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'corretto'

      - name: Chmod GradleW
        run: chmod a+x gradlew

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: .

      - name: Publish Build Artifacts
        uses: gradle/gradle-build-action@749f47bda3e44aa060e82d7b3ef7e40d953bd629
        with:
          gradle-executable: gradlew
          arguments: publishAllPublicationsToGitHubPackagesRepository -x test -x build -x jar -x compileJava -x processResources -x classes -x testJar -x testFixturesJar -x testClasses -x testFixturesClasses

